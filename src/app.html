<!doctype html>
<html lang="pt">
	<head>
		<meta charset="utf-8" />
		<meta content="width=device-width, initial-scale=1" name="viewport" />

		<!-- SEO Meta Tags -->
		<meta name="robots" content="index, follow" />
		<meta name="author" content="ImmoLux" />
		<meta
			name="keywords"
			content="imóveis Portugal, casas venda Portugal, propriedades luxo, imobiliário Portugal, moradias, apartamentos, terrenos"
		/>

		<!-- Open Graph / Facebook -->
		<meta property="og:type" content="website" />
		<meta property="og:locale" content="pt_PT" />
		<meta property="og:site_name" content="ImmoLux" />

		<!-- Twitter -->
		<meta name="twitter:card" content="summary_large_image" />

		<title>ImmoLux</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
