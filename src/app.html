<!doctype html>
<html lang="pt">
	<head>
		<meta charset="utf-8" />
		<meta content="width=device-width, initial-scale=1" name="viewport" />

		<!-- Performance & Security -->
		<meta content="#fbfcfe" media="(prefers-color-scheme: light)" name="theme-color" />
		<meta content="#14151c" media="(prefers-color-scheme: dark)" name="theme-color" />
		<link rel="dns-prefetch" href="https://nominatim.openstreetmap.org" />
		<link rel="preconnect" href="https://unpkg.com" crossorigin />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

		<!-- Fonts are linked here rather than @imported from app.css: an @import is
		     only discovered after the stylesheet downloads, which serialises the
		     request and delays first paint of every heading. -->
		<link
			href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..700,0..100,0..1&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@300;400;500&display=swap"
			rel="stylesheet"
		/>

		<!-- SEO Meta Tags -->
		<meta name="robots" content="index, follow" />
		<meta name="author" content="ImmoLux" />

		<!-- Open Graph / Facebook -->
		<meta property="og:type" content="website" />
		<meta property="og:locale" content="pt_PT" />
		<meta property="og:site_name" content="ImmoLux" />

		<!-- Twitter -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:site" content="@ImmoLux" />

		<!-- Organization structured data (global) -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "RealEstateAgent",
				"@id": "https://immolux.pt/#organization",
				"name": "ImmoLux",
				"url": "https://immolux.pt",
				"description": "Real estate platform for buying and selling properties in Portugal"
			}
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
